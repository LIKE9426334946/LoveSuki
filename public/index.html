<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LoveSuki Markdown 文章逐字显示页面。" />
    <meta name="theme-color" content="#f8f1f3" />
    <title>LoveSuki · 逐字显示</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="LoveSuki 显示页面">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LoveSuki</span>
        </a>
        <div class="topbar-actions">
          <a class="page-link" href="/admin" aria-label="进入管理页面">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm8.7 2a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8.7 8.7 0 0 0-1.8-1L16 3.5h-4L11.6 6a8.7 8.7 0 0 0-1.8 1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2.1l-2 1.5 2 3.4 2.4-1a8.7 8.7 0 0 0 1.8 1l.4 2.6h4l.4-2.6a8.7 8.7 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z" /></svg>
            <span>管理</span>
          </a>
          <button id="logoutButton" class="page-link page-link-button" type="button" aria-label="退出登录">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 3h9a2 2 0 0 1 2 2v3h-2V5H4v14h9v-3h2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm14.6 5.6L22 12l-3.4 3.4-1.4-1.4 1-1H9v-2h9.2l-1-1 1.4-1.4Z" /></svg>
            <span>退出</span>
          </button>
        </div>
      </header>

      <section class="workspace viewer-workspace" aria-label="LoveSuki 逐字显示">
        <aside class="library-panel viewer-library-panel" aria-label="只读文章目录">
          <div class="library-heading">
            <div>
              <p class="eyebrow">文章库</p>
              <h1>选择文章</h1>
            </div>
          </div>

          <div id="libraryLoading" class="library-loading">
            <span class="loading-ring" aria-hidden="true"></span>
            <span>正在读取文章库</span>
          </div>
          <div id="directoryList" class="directory-list" hidden></div>
          <div id="libraryEmpty" class="library-empty" hidden>
            <p>还没有可显示的文章</p>
            <a href="/admin">前往管理页面创建</a>
          </div>

          <div class="library-footer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5c5.5 0 9.7 5.1 10.5 6.1a1.4 1.4 0 0 1 0 1.8C21.7 13.9 17.5 19 12 19S2.3 13.9 1.5 12.9a1.4 1.4 0 0 1 0-1.8C2.3 10.1 6.5 5 12 5Zm0 2c-4 0-7.4 3.5-8.4 5 1 1.5 4.4 5 8.4 5s7.4-3.5 8.4-5c-1-1.5-4.4-5-8.4-5Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm0 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" /></svg>
            <span>只读显示页面</span>
          </div>
        </aside>

        <section class="display-panel viewer-display-panel" aria-label="Markdown 逐字显示区域">
          <div class="display-toolbar">
            <div class="viewer-status-copy">
              <strong id="viewerArticleTitle">选择一篇文章</strong>
              <div class="status-group">
                <span id="statusDot" class="status-dot" aria-hidden="true"></span>
                <span id="statusText">等待选择</span>
              </div>
            </div>
            <div class="viewer-toolbar-actions">
              <div class="compact-speed-setting">
                <label for="speedRange">速度</label>
                <input id="speedRange" type="range" min="10" max="500" value="50" step="10" />
                <output id="speedOutput" for="speedRange">50 ms</output>
              </div>
              <div class="toolbar-actions">
                <button id="petToggleButton" class="icon-button pet-toggle-button is-active" type="button" title="隐藏桌宠" aria-label="显示或隐藏桌宠" aria-pressed="true">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8.4 10.2c1.4 0 2.5-1.4 2.5-3.1S9.8 4 8.4 4 5.9 5.4 5.9 7.1s1.1 3.1 2.5 3.1Zm7.2 0c1.4 0 2.5-1.4 2.5-3.1S17 4 15.6 4s-2.5 1.4-2.5 3.1 1.1 3.1 2.5 3.1ZM4.7 14c1.2 0 2.2-1.2 2.2-2.7s-1-2.7-2.2-2.7-2.2 1.2-2.2 2.7 1 2.7 2.2 2.7Zm14.6 0c1.2 0 2.2-1.2 2.2-2.7s-1-2.7-2.2-2.7-2.2 1.2-2.2 2.7 1 2.7 2.2 2.7ZM12 11c-3.3 0-6.3 3.2-6.3 5.8 0 2 1.6 3.2 3.5 3.2 1 0 1.9-.4 2.8-1 .9.6 1.8 1 2.8 1 1.9 0 3.5-1.2 3.5-3.2C18.3 14.2 15.3 11 12 11Z" /></svg>
                </button>
                <button id="restartButton" class="icon-button" type="button" title="重新开始" aria-label="重新开始" disabled>
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4.9 7.4A9 9 0 1 1 3 13h2a7 7 0 1 0 1.5-4.3L9 11H3V5l1.9 2.4Z" /></svg>
                </button>
                <button id="fullscreenButton" class="icon-button" type="button" title="专注显示" aria-label="进入专注显示">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3Z" /></svg>
                </button>
              </div>
            </div>
          </div>

          <div id="displaySurface" class="display-surface" tabindex="0">
            <div id="emptyState" class="empty-state">
              <div class="empty-symbol" aria-hidden="true">“</div>
              <p id="emptyStateMessage">选择一篇文章开始显示</p>
              <span id="emptyStateHint">从左侧目录中选择文章</span>
            </div>
            <article id="renderedText" class="rendered-text markdown-body" aria-live="off"></article>
          </div>

          <div class="playback-bar">
            <button id="playbackButton" class="playback-button" type="button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path id="playIcon" d="M8 5.7v12.6a1 1 0 0 0 1.53.85l9.4-6.3a1 1 0 0 0 0-1.7l-9.4-6.3A1 1 0 0 0 8 5.7Z" /></svg>
              <span id="playbackLabel">开始</span>
            </button>
            <div class="progress-wrap">
              <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
              <div class="progress-copy"><span id="progressText">0 / 0</span><span id="progressPercent">0%</span></div>
            </div>
          </div>

          <div id="desktopPet" class="desktop-pet" role="button" tabindex="0" aria-label="桌宠，点击互动，拖动移动">
            <div class="pet-sprite" aria-hidden="true"></div>
            <span class="pet-tooltip" aria-hidden="true">拖动我 · 点我互动</span>
          </div>
        </section>
      </section>

      <footer class="footer-note viewer-footer"><span>Space 暂停 / 继续 · Esc 退出专注</span></footer>
    </main>

    <script type="module" src="/scripts/viewer.js"></script>
  </body>
</html>
