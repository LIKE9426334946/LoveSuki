<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LoveSuki 是一个支持 Markdown、目录和文章保存的逐字阅读工具。" />
    <meta name="theme-color" content="#f8f1f3" />
    <title>LoveSuki · Markdown 逐字阅读</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="LoveSuki 首页">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LoveSuki</span>
        </a>
        <p class="tagline">把想说的话，慢慢写下来</p>
        <div class="global-status">
          <span id="serverStatusDot" class="server-dot" aria-hidden="true"></span>
          <span id="serverStatusText">正在连接</span>
        </div>
      </header>

      <section class="workspace" aria-label="LoveSuki 文章管理与逐字阅读">
        <aside class="library-panel" aria-label="文章目录">
          <div class="library-heading">
            <div>
              <p class="eyebrow">文章库</p>
              <h1>目录</h1>
            </div>
            <button id="newDirectoryButton" class="icon-button accent-icon" type="button" title="新建目录" aria-label="新建目录">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z" /></svg>
            </button>
          </div>

          <div id="libraryLoading" class="library-loading">
            <span class="loading-ring" aria-hidden="true"></span>
            <span>正在读取文章库</span>
          </div>
          <div id="directoryList" class="directory-list" hidden></div>
          <div id="libraryEmpty" class="library-empty" hidden>
            <p>还没有目录</p>
            <button id="emptyNewDirectoryButton" type="button">创建第一个目录</button>
          </div>

          <div class="library-footer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm0 2.2L18 6.5V11c0 3.9-2.4 7.6-6 8.8-3.6-1.2-6-4.9-6-8.8V6.5l6-2.3Z" /></svg>
            <span>文章保存在服务器</span>
          </div>
        </aside>

        <section class="editor-panel" aria-label="Markdown 文章编辑器">
          <div id="editorEmpty" class="editor-empty">
            <div class="empty-paper" aria-hidden="true"><span></span><span></span><span></span></div>
            <h2>选择一篇文章开始编辑</h2>
            <p>也可以在左侧目录中创建一篇新文章</p>
          </div>

          <div id="editorContent" class="editor-content" hidden>
            <div class="article-meta-row">
              <select id="articleDirectory" aria-label="文章所属目录"></select>
              <span id="saveState" class="save-state">已保存</span>
            </div>
            <label class="sr-only" for="articleTitle">文章标题</label>
            <input id="articleTitle" class="article-title" type="text" maxlength="120" placeholder="文章标题" />

            <div class="editor-toolbar">
              <div class="markdown-badge">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v10h18V7H3Zm2 8V9h2l2 2.5L11 9h2v6h-2v-3.2l-2 2.5-2-2.5V15H5Zm11-3h-2l3 3 3-3h-2V9h-2v3Z" /></svg>
                <span>Markdown</span>
              </div>
              <span id="characterCount" class="character-count">0 字</span>
            </div>

            <label class="sr-only" for="textInput">Markdown 文章内容</label>
            <textarea id="textInput" maxlength="10000000" placeholder="# 标题&#10;&#10;在这里使用 Markdown 写下文章……" spellcheck="false"></textarea>

            <div class="markdown-help" aria-label="Markdown 简单提示">
              <code># 标题</code><code>**加粗**</code><code>- 列表</code><code>&gt; 引用</code><code>`代码`</code>
            </div>

            <div class="speed-setting">
              <div class="setting-copy">
                <label for="speedRange">显示速度</label>
                <output id="speedOutput" for="speedRange">50 毫秒 / 字</output>
              </div>
              <input id="speedRange" type="range" min="10" max="500" value="50" step="10" />
              <div class="range-labels" aria-hidden="true"><span>快</span><span>慢</span></div>
            </div>

            <div class="editor-actions">
              <button id="deleteArticleButton" class="button button-danger-quiet" type="button">删除</button>
              <div class="editor-actions-main">
                <button id="saveButton" class="button button-secondary" type="button">保存文章</button>
                <button id="startButton" class="button button-primary" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.7v12.6a1 1 0 0 0 1.53.85l9.4-6.3a1 1 0 0 0 0-1.7l-9.4-6.3A1 1 0 0 0 8 5.7Z" /></svg>
                  <span>开始显示</span>
                </button>
              </div>
            </div>
            <p id="editorMessage" class="editor-message" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="display-panel" aria-label="Markdown 逐字显示区域">
          <div class="display-toolbar">
            <div class="status-group">
              <span id="statusDot" class="status-dot" aria-hidden="true"></span>
              <span id="statusText">等待开始</span>
            </div>
            <div class="toolbar-actions">
              <button id="restartButton" class="icon-button" type="button" title="重新开始" aria-label="重新开始" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4.9 7.4A9 9 0 1 1 3 13h2a7 7 0 1 0 1.5-4.3L9 11H3V5l1.9 2.4Z" /></svg>
              </button>
              <button id="fullscreenButton" class="icon-button" type="button" title="专注显示" aria-label="进入专注显示">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3Z" /></svg>
              </button>
            </div>
          </div>

          <div id="displaySurface" class="display-surface" tabindex="0">
            <div id="emptyState" class="empty-state">
              <div class="empty-symbol" aria-hidden="true">“</div>
              <p>Markdown 文章会在这里慢慢出现</p>
              <span>选择文章，然后点击开始显示</span>
            </div>
            <article id="renderedText" class="rendered-text markdown-body" aria-live="off"></article>
          </div>

          <div class="playback-bar">
            <button id="playbackButton" class="playback-button" type="button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path id="playIcon" d="M8 5.7v12.6a1 1 0 0 0 1.53.85l9.4-6.3a1 1 0 0 0 0-1.7l-9.4-6.3A1 1 0 0 0 8 5.7Z" /></svg>
              <span id="playbackLabel">暂停</span>
            </button>
            <div class="progress-wrap">
              <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
              <div class="progress-copy"><span id="progressText">0 / 0</span><span id="progressPercent">0%</span></div>
            </div>
          </div>
        </section>
      </section>

      <footer class="footer-note"><span>Ctrl + S 保存文章</span><span>Space 暂停 / 继续 · Esc 退出专注</span></footer>
    </main>

    <dialog id="directoryDialog" class="app-dialog">
      <form id="directoryForm" method="dialog">
        <input id="directoryDialogMode" type="hidden" value="create" />
        <input id="editingDirectoryId" type="hidden" />
        <p class="eyebrow">文章库</p>
        <h2 id="directoryDialogTitle">新建目录</h2>
        <label for="directoryName">目录名称</label>
        <input id="directoryName" type="text" maxlength="80" autocomplete="off" required placeholder="例如：想说的话" />
        <p id="directoryDialogMessage" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog="directoryDialog">取消</button>
          <button class="button button-primary" type="submit">确认</button>
        </div>
      </form>
    </dialog>

    <dialog id="articleDialog" class="app-dialog">
      <form id="articleForm" method="dialog">
        <p class="eyebrow">Markdown 文章</p>
        <h2>新建文章</h2>
        <label for="newArticleDirectory">所属目录</label>
        <select id="newArticleDirectory" required></select>
        <label for="newArticleTitle">文章标题</label>
        <input id="newArticleTitle" type="text" maxlength="120" autocomplete="off" required placeholder="输入文章标题" />
        <p id="articleDialogMessage" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog="articleDialog">取消</button>
          <button class="button button-primary" type="submit">创建文章</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
