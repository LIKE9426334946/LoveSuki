<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LoveSuki 是一个简洁、沉浸的文字逐字显示工具。"
    />
    <meta name="theme-color" content="#f8f1f3" />
    <title>LoveSuki · 让文字慢慢出现</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="LoveSuki 首页">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LoveSuki</span>
        </a>
        <p class="tagline">让每一句话，都被好好看见</p>
      </header>

      <section class="workspace" aria-label="文字逐字显示工具">
        <aside class="editor-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">输入内容</p>
              <h1>写下想展示的文字</h1>
            </div>
            <span id="characterCount" class="character-count">0 字</span>
          </div>

          <label class="sr-only" for="textInput">需要逐字显示的内容</label>
          <textarea
            id="textInput"
            maxlength="10000000"
            placeholder="在这里输入或粘贴文字……\n\n点击「开始显示」，让它一个字一个字地出现。"
            spellcheck="false"
          ></textarea>

          <div class="speed-setting">
            <div class="setting-copy">
              <label for="speedRange">显示速度</label>
              <output id="speedOutput" for="speedRange">50 毫秒 / 字</output>
            </div>
            <input
              id="speedRange"
              type="range"
              min="10"
              max="500"
              value="50"
              step="10"
              aria-describedby="speedHint"
            />
            <div id="speedHint" class="range-labels" aria-hidden="true">
              <span>快</span>
              <span>慢</span>
            </div>
          </div>

          <div class="primary-actions">
            <button id="startButton" class="button button-primary" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 5.7v12.6a1 1 0 0 0 1.53.85l9.4-6.3a1 1 0 0 0 0-1.7l-9.4-6.3A1 1 0 0 0 8 5.7Z" />
              </svg>
              <span>开始显示</span>
            </button>
            <button id="clearButton" class="button button-quiet" type="button">清空</button>
          </div>
          <p id="editorMessage" class="editor-message" role="status" aria-live="polite"></p>
        </aside>

        <section class="display-panel" aria-label="文字显示区域">
          <div class="display-toolbar">
            <div class="status-group">
              <span id="statusDot" class="status-dot" aria-hidden="true"></span>
              <span id="statusText">等待开始</span>
            </div>
            <div class="toolbar-actions">
              <button id="restartButton" class="icon-button" type="button" title="重新开始" aria-label="重新开始" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M4.9 7.4A9 9 0 1 1 3 13h2a7 7 0 1 0 1.5-4.3L9 11H3V5l1.9 2.4Z" />
                </svg>
              </button>
              <button id="fullscreenButton" class="icon-button" type="button" title="专注显示" aria-label="进入专注显示">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3Z" />
                </svg>
              </button>
            </div>
          </div>

          <div id="displaySurface" class="display-surface" tabindex="0">
            <div id="emptyState" class="empty-state">
              <div class="empty-symbol" aria-hidden="true">“</div>
              <p>你的文字会在这里慢慢出现</p>
              <span>输入内容，然后点击开始显示</span>
            </div>
            <div id="renderedText" class="rendered-text" aria-live="off"></div>
          </div>

          <div class="playback-bar">
            <button id="playbackButton" class="playback-button" type="button" disabled>
              <svg id="playIcon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 5.7v12.6a1 1 0 0 0 1.53.85l9.4-6.3a1 1 0 0 0 0-1.7l-9.4-6.3A1 1 0 0 0 8 5.7Z" />
              </svg>
              <span id="playbackLabel">暂停</span>
            </button>
            <div class="progress-wrap">
              <div class="progress-track" aria-hidden="true">
                <div id="progressFill" class="progress-fill"></div>
              </div>
              <div class="progress-copy">
                <span id="progressText">0 / 0</span>
                <span id="progressPercent">0%</span>
              </div>
            </div>
          </div>
        </section>
      </section>

      <footer class="footer-note">
        <span>基础版本 · 本次输入仅保留在当前页面</span>
        <span>Space 暂停 / 继续 · Esc 退出专注</span>
      </footer>
    </main>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
