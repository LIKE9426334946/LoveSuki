<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LoveSuki 目录与 Markdown 文章管理页面。" />
    <meta name="theme-color" content="#f8f1f3" />
    <title>LoveSuki · 管理</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body class="admin-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/admin" aria-label="LoveSuki 管理页面">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LoveSuki Admin</span>
        </a>
        <div class="topbar-actions">
          <button id="adminSettingsButton" class="page-link page-link-button" type="button" aria-label="每日文章设置">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.1 13a7.7 7.7 0 0 0 .1-1 7.7 7.7 0 0 0-.1-1l2.1-1.6-2-3.4-2.6 1a8.7 8.7 0 0 0-1.7-1L14.5 3h-4L10 5.9a8.7 8.7 0 0 0-1.7 1L5.7 6l-2 3.4L5.8 11a7.7 7.7 0 0 0-.1 1 7.7 7.7 0 0 0 .1 1l-2.1 1.6 2 3.4 2.6-1a8.7 8.7 0 0 0 1.7 1l.5 2.9h4L15 18a8.7 8.7 0 0 0 1.7-1l2.6 1 2-3.4-2.2-1.6ZM12.5 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" /></svg>
            <span>设置</span>
          </button>
          <a class="page-link" href="/" aria-label="返回显示页面">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5c5.5 0 9.7 5.1 10.5 6.1a1.4 1.4 0 0 1 0 1.8C21.7 13.9 17.5 19 12 19S2.3 13.9 1.5 12.9a1.4 1.4 0 0 1 0-1.8C2.3 10.1 6.5 5 12 5Zm0 2c-4 0-7.4 3.5-8.4 5 1 1.5 4.4 5 8.4 5s7.4-3.5 8.4-5c-1-1.5-4.4-5-8.4-5Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm0 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" /></svg>
            <span>显示页面</span>
          </a>
          <button id="logoutButton" class="page-link page-link-button" type="button" aria-label="退出登录">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 3h9a2 2 0 0 1 2 2v3h-2V5H4v14h9v-3h2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm14.6 5.6L22 12l-3.4 3.4-1.4-1.4 1-1H9v-2h9.2l-1-1 1.4-1.4Z" /></svg>
            <span>退出</span>
          </button>
        </div>
      </header>

      <section class="workspace admin-workspace" aria-label="LoveSuki 文章管理">
        <aside class="library-panel" aria-label="文章目录">
          <div class="library-heading">
            <div>
              <p class="eyebrow">文章库</p>
              <h1>目录</h1>
            </div>
            <button id="newDirectoryButton" class="icon-button accent-icon" type="button" title="新建目录" aria-label="新建目录">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z" /></svg>
            </button>
          </div>

          <div id="libraryLoading" class="library-loading">
            <span class="loading-ring" aria-hidden="true"></span>
            <span>正在读取文章库</span>
          </div>
          <div id="directoryList" class="directory-list" hidden></div>
          <div id="libraryEmpty" class="library-empty" hidden>
            <p>还没有目录</p>
            <button id="emptyNewDirectoryButton" type="button">创建第一个目录</button>
          </div>

          <div class="library-footer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm0 2.2L18 6.5V11c0 3.9-2.4 7.6-6 8.8-3.6-1.2-6-4.9-6-8.8V6.5l6-2.3Z" /></svg>
            <span>文章保存在服务器</span>
          </div>
        </aside>

        <section class="editor-panel admin-editor-panel" aria-label="Markdown 文章编辑器">
          <div id="editorEmpty" class="editor-empty">
            <div class="empty-paper" aria-hidden="true"><span></span><span></span><span></span></div>
            <h2>选择一篇文章开始编辑</h2>
            <p>也可以在左侧目录中创建一篇新文章</p>
          </div>

          <div id="editorContent" class="editor-content admin-editor-content" hidden>
            <div class="article-meta-row">
              <select id="articleDirectory" aria-label="文章所属目录"></select>
              <span id="saveState" class="save-state">已保存</span>
            </div>
            <label class="sr-only" for="articleTitle">文章标题</label>
            <input id="articleTitle" class="article-title" type="text" maxlength="120" placeholder="文章标题" />

            <div class="editor-toolbar">
              <div class="markdown-badge">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v10h18V7H3Zm2 8V9h2l2 2.5L11 9h2v6h-2v-3.2l-2 2.5-2-2.5V15H5Zm11-3h-2l3 3 3-3h-2V9h-2v3Z" /></svg>
                <span>Markdown</span>
              </div>
              <span id="characterCount" class="character-count">0 字</span>
            </div>

            <label class="sr-only" for="textInput">Markdown 文章内容</label>
            <textarea id="textInput" maxlength="10000000" placeholder="# 标题&#10;&#10;在这里使用 Markdown 写下文章……" spellcheck="false"></textarea>

            <div class="markdown-help" aria-label="Markdown 简单提示">
              <code># 标题</code><code>**加粗**</code><code>- 列表</code><code>&gt; 引用</code><code>`代码`</code>
            </div>

            <section class="article-audio-manager" aria-label="文章音频管理">
              <div class="audio-manager-heading">
                <div>
                  <strong>文章音频</strong>
                  <span id="adminAudioState">未上传音频</span>
                </div>
                <div class="audio-manager-actions">
                  <input id="audioFileInput" type="file" accept="audio/mpeg,audio/mp4,audio/m4a,audio/aac,audio/wav,audio/ogg,audio/webm,.mp3,.m4a,.aac,.wav,.ogg,.webm" hidden />
                  <button id="selectAudioButton" class="button button-secondary" type="button">上传音频</button>
                  <button id="deleteAudioButton" class="button button-danger-quiet" type="button" hidden>删除音频</button>
                </div>
              </div>
              <audio id="adminAudioPreview" class="admin-audio-preview" controls preload="metadata" hidden></audio>
            </section>

            <div class="editor-actions">
              <button id="deleteArticleButton" class="button button-danger-quiet" type="button">删除文章</button>
              <button id="saveButton" class="button button-primary" type="button">保存文章</button>
            </div>
            <p id="editorMessage" class="editor-message" role="status" aria-live="polite"></p>
          </div>
        </section>
      </section>

      <footer class="footer-note admin-footer"><span>Ctrl + S 保存文章</span></footer>
    </main>

    <dialog id="directoryDialog" class="app-dialog">
      <form id="directoryForm" method="dialog">
        <input id="directoryDialogMode" type="hidden" value="create" />
        <input id="editingDirectoryId" type="hidden" />
        <p class="eyebrow">文章库</p>
        <h2 id="directoryDialogTitle">新建目录</h2>
        <label for="directoryName">目录名称</label>
        <input id="directoryName" type="text" maxlength="80" autocomplete="off" required placeholder="例如：想说的话" />
        <p id="directoryDialogMessage" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog="directoryDialog">取消</button>
          <button class="button button-primary" type="submit">确认</button>
        </div>
      </form>
    </dialog>

    <dialog id="articleDialog" class="app-dialog">
      <form id="articleForm" method="dialog">
        <p class="eyebrow">Markdown 文章</p>
        <h2>新建文章</h2>
        <label for="newArticleDirectory">所属目录</label>
        <select id="newArticleDirectory" required></select>
        <label for="newArticleTitle">文章标题</label>
        <input id="newArticleTitle" type="text" maxlength="120" autocomplete="off" required placeholder="输入文章标题" />
        <p id="articleDialogMessage" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog="articleDialog">取消</button>
          <button class="button button-primary" type="submit">创建文章</button>
        </div>
      </form>
    </dialog>

    <dialog id="renameArticleDialog" class="app-dialog">
      <form id="renameArticleForm" method="dialog">
        <input id="renamingArticleId" type="hidden" />
        <p class="eyebrow">文章管理</p>
        <h2>重命名文章</h2>
        <label for="renameArticleTitle">新标题</label>
        <input id="renameArticleTitle" type="text" maxlength="120" autocomplete="off" required />
        <p id="renameArticleMessage" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog="renameArticleDialog">取消</button>
          <button class="button button-primary" type="submit">确认重命名</button>
        </div>
      </form>
    </dialog>

    <dialog id="syncSettingsDialog" class="app-dialog settings-dialog">
      <form id="syncSettingsForm" method="dialog">
        <p class="eyebrow">自动同步</p>
        <h2>每日文章设置</h2>

        <label class="switch-setting" for="dailyArticleSyncEnabled">
          <span class="switch-setting-copy">
            <strong>每天拉取文章</strong>
            <small>开启后每天 07:10 检查当天文章，失败会持续重试。</small>
          </span>
          <input id="dailyArticleSyncEnabled" type="checkbox" role="switch" />
          <span class="switch-control" aria-hidden="true"></span>
        </label>

        <label class="select-setting" for="dailyArticleOrder">
          <span>
            <strong>月目录中的文章顺序</strong>
            <small>只调整自动导入的日期文章显示顺序。</small>
          </span>
          <select id="dailyArticleOrder">
            <option value="ascending">顺序（日期从早到晚）</option>
            <option value="descending">逆序（日期从晚到早）</option>
          </select>
        </label>

        <p id="syncSettingsMessage" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog="syncSettingsDialog">取消</button>
          <button id="saveSyncSettingsButton" class="button button-primary" type="submit">保存设置</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/scripts/admin.js"></script>
  </body>
</html>
